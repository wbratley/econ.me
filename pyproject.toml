[project]
name = "econ-me"
version = "0.1.0"
description = "econ.me — FastAPI app over the econengine core; owns DB config and Alembic migrations."
requires-python = ">=3.11"
dependencies = [
    "econengine",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "authlib>=1.3",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "itsdangerous>=2.1",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["econ*"]
